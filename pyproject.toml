[project]
name = "arrows"
version = "0.2.0"
description = "Universal data wrangling tool built around Apache Arrow, DuckDB, Polars, S3 for efficiently transferring and transforming data between different data sources with pluggable, independently loadable components"
readme = "README.md"
authors = [
    { name = "George Jiang", email = "huifengjiang@gmail.com" }
]
requires-python = ">=3.11"

# One list, no extras: `pip install arrows` installs every component's
# dependencies. This is an *install-time* choice only — `import arrows` touches
# none of these, and a component's libraries are imported the first time it is
# loaded, so a job that only sends email never pays for boto3.
dependencies = [
    # core
    "duckdb>=1.5.5",
    "jinja2>=3.1.6",
    "pyarrow>=25.0.1",
    # aws, s3, redshift
    "adbc-driver-postgresql==1.11.0",
    "awswrangler>=3.17.1",
    "boto3>=1.35",
    "psycopg2-binary>=2.9.13",
    # google
    "google-api-python-client>=2.200.0",
    "google-auth>=2.58.0",
    # dataframes
    "pandas>=2.2",
    "polars>=1.44.2",
    # secret storage for login(save=True)
    "keyring>=25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.14",
]

[project.scripts]
arrows = "arrows.cli:main"

# Third-party packages plug components in here; arrows discovers them at runtime
# and never needs to import them until they are loaded.
[project.entry-points."arrows.components"]
# example = "my_package.component:SPEC"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
