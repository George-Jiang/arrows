name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          # Measured, counterintuitive: restoring the 193 MB uv cache takes
          # ~5.8s to save ~1.2s, because uv downloads the whole dependency set
          # from PyPI in about two seconds. Must be an explicit false — the
          # default 'auto' resolves to true for push and pull_request.
          enable-cache: false
      - run: uv lock --check
      - run: uv sync --locked --all-groups --python ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
